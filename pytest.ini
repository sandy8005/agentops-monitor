[pytest]
# Tests live under tests/. Manual print-scripts live under scripts/manual/ and are
# deliberately NOT collected (they print, they don't assert).
testpaths = tests

# Custom markers. Register them here so `--strict-markers` doesn't warn.
markers =
    db: test needs a live Postgres database (skip with -m "not db")
    e2e: end-to-end test needing langgraph + Postgres (skip with -m "not e2e")

addopts = --strict-markers