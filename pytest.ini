[pytest]
# Tests live under tests/ (the old print-only scripts/manual/ checks were replaced
# by asserting tests in tests/test_ported_manual_checks.py).
testpaths = tests

# Custom markers. Register them here so `--strict-markers` doesn't warn.
markers =
    db: test needs a live Postgres database (skip with -m "not db")
    e2e: end-to-end test needing langgraph + Postgres (skip with -m "not e2e")

addopts = --strict-markers -p no:cacheprovider